name: Build macOS Release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install whisper.cpp
        run: brew install whisper-cpp

      - name: Run Tests
        run: swift test

      - name: Build App
        run: make app

      - name: Package
        run: |
          cd build
          zip -r Muesli-macOS.zip Muesli.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muesli-macOS
          path: build/Muesli-macOS.zip

      - name: Extract Release Notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          tag = os.environ["GITHUB_REF_NAME"]
          changelog = pathlib.Path("CHANGELOG.md")
          out_path = pathlib.Path("build/release-notes.md")
          has_notes = False

          if changelog.exists():
              text = changelog.read_text(encoding="utf-8")
              pattern = re.compile(
                  rf"^##\s+{re.escape(tag)}\s*\n(.*?)(?=^##\s+|\Z)",
                  re.MULTILINE | re.DOTALL,
              )
              match = pattern.search(text)
              if match:
                  body = match.group(1).strip()
                  if body:
                      out_path.parent.mkdir(parents=True, exist_ok=True)
                      out_path.write_text(body + "\n", encoding="utf-8")
                      has_notes = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"has_notes={'true' if has_notes else 'false'}\n")
          PY

      - name: Create Release (with Changelog)
        if: startsWith(github.ref, 'refs/tags/') && steps.notes.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Muesli-macOS.zip
          body_path: build/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (Auto Notes Fallback)
        if: startsWith(github.ref, 'refs/tags/') && steps.notes.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Muesli-macOS.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
